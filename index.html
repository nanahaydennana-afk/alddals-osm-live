<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>알딸쓰 · 실제 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Gugi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f4ef;color:#161616}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:48px;height:48px;flex:0 0 auto;border-radius:16px;background:linear-gradient(145deg,#ff6a3d,#ff3d35);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:950;box-shadow:0 9px 22px rgba(255,74,48,.28)}.brand-copy{display:flex;min-width:0;flex-direction:column;gap:2px}.brand-name{font-size:15px;font-weight:950;letter-spacing:-.035em;color:#6a6761}.tagline{font-family:'Gugi',system-ui,sans-serif;font-size:clamp(21px,2.3vw,31px);line-height:1.12;font-weight:400;letter-spacing:-.03em;color:#171716;text-wrap:balance}.tagline .price-age{display:inline-block;transform:skewX(-5deg);transform-origin:left bottom;text-shadow:2px 2px 0 rgba(255,208,62,.38)}.tagline .tipsy{display:inline-block;margin-top:4px;padding:5px 11px 7px;border-radius:11px;background:linear-gradient(135deg,#ff6337,#ff3457);color:#fff;box-shadow:0 8px 18px rgba(255,61,65,.25);text-shadow:0 1px 1px rgba(90,0,0,.18);transform:rotate(-1deg) skewX(-2deg);animation:tipsy-pop .55s cubic-bezier(.2,.8,.2,1) both}.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.bang-link{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:#1e1e1d;color:#fff;padding:10px 14px;font-weight:900;text-decoration:none;box-shadow:0 5px 14px rgba(0,0,0,.16);transition:transform .16s ease,background .16s ease}.bang-link:hover{background:#ff5a36;transform:translateY(-2px) rotate(-1deg)}.report{flex:0 0 auto;border:1px solid #e6cf00;border-radius:12px;background:#fee500;padding:9px 13px;font-weight:800;color:#191919;box-shadow:0 2px 8px rgba(0,0,0,.05)}.report:hover{background:#f6dd00}.controls{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}.controls input,.controls select{border:1px solid #d8d6cf;border-radius:12px;background:white;padding:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px}.mapbox{position:relative;background:white;border-radius:18px;overflow:hidden;border:1px solid #ddd}.map{height:660px}.locate{position:absolute;z-index:500;right:12px;top:78px;width:42px;height:42px;border:1px solid #bbb;border-radius:12px;background:white;font-size:22px}.detail{background:#fff;border:1px solid #ddd;border-radius:18px;overflow:hidden;align-self:start;position:sticky;top:10px}.gallery{position:relative;background:#eee}.mainimg{width:100%;height:250px;object-fit:cover;display:block}.thumbs{display:flex;gap:6px;padding:8px;overflow:auto}.thumbs img{width:68px;height:52px;object-fit:cover;border-radius:8px;border:2px solid transparent}.thumbs button.active img{border-color:#ff5a36}.close{display:none;position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:white;font-size:24px}.pad{padding:16px}.status{font-size:12px;color:#53755d}.deal{background:#fff5ec;border:1px solid #ffd7c8;border-radius:12px;padding:11px;margin:12px 0}.event-date{margin-top:8px;padding-top:8px;border-top:1px dashed #efc7b7;font-size:12px;color:#8a5a46;font-weight:700}.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.price{background:#f7f7f5;border-radius:12px;padding:11px}.price span{font-size:12px;color:#6b6b68;display:block}.price strong{font-size:20px}.total{display:flex;justify-content:space-between;align-items:end;margin-top:12px;padding:12px;background:#20201f;color:white;border-radius:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions a{padding:11px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800}.secondary{background:#03c75a;color:#fff}.primary{background:#ff5a36;color:#fff}.pin{background:white;border:1px solid #cfcac1;border-radius:13px;padding:6px 8px;box-shadow:0 5px 18px rgba(0,0,0,.15);min-width:142px;text-align:center;transform:translateY(-4px)}.pin small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}.pin b{display:flex;justify-content:center;gap:6px;font-size:11px;color:#ff5a36}.pin.sel{background:#ff5a36;color:white;border-color:#ff5a36}.pin.sel b{color:white}.leaflet-div-icon{background:transparent;border:0}.empty{padding:28px;color:#777}.foot{font-size:12px;color:#777;margin-top:10px;text-align:center}@keyframes tipsy-pop{0%{opacity:0;transform:translateY(8px) rotate(-4deg) skewX(-4deg) scale(.94)}70%{transform:translateY(-2px) rotate(1deg) skewX(-2deg) scale(1.03)}100%{opacity:1;transform:rotate(-1deg) skewX(-2deg) scale(1)}}@media(prefers-reduced-motion:reduce){.tagline .tipsy{animation:none}}@media(max-width:760px){.wrap{padding:10px}.layout{display:block}.map{height:58vh;min-height:390px}.detail{position:relative;margin-top:10px}.close{display:block}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.mainimg{height:230px}.top{position:relative;align-items:flex-start;padding-right:94px;gap:8px}.brand{align-items:flex-start;gap:9px}.logo{width:41px;height:41px;border-radius:13px;font-size:20px}.brand-name{font-size:12px}.tagline{font-size:clamp(17px,5.2vw,22px);line-height:1.1}.tagline .tipsy{margin-top:3px;padding:4px 7px 6px;border-radius:9px}.top-actions{position:absolute;top:0;right:0;gap:6px}.report,.bang-link{width:40px;height:40px;overflow:hidden;padding:0;font-size:0}.report::before{content:'💬';font-size:17px}.bang-link::before{content:'🍻';font-size:19px}}
.bang-icon{position:absolute;z-index:600;left:14px;top:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.96);text-decoration:none;font-size:23px;box-shadow:0 8px 20px rgba(0,0,0,.17);border:1px solid rgba(0,0,0,.08);backdrop-filter:blur(6px);transition:transform .15s ease,box-shadow .15s ease}.bang-icon:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 10px 24px rgba(0,0,0,.2)}@media(max-width:760px){.bang-icon{left:10px;top:10px;width:42px;height:42px;font-size:22px}}
</style></head><body>

<div class="wrap"><div class="top"><div class="brand"><span class="logo">알</span><div class="brand-copy"><span class="brand-name">알딸쓰</span><div class="tagline"><span class="price-age">고물가, 고유가, 고酒가 시대에</span><br><span class="tipsy">알딸딸한 주당들의 집합소</span></div></div></div><div class="top-actions"><a class="bang-link" href="bang.html">🍻 술벙개방</a><button class="report" id="report">💬 정보 공유</button></div></div>
<div class="controls"><input id="q" placeholder="술집·동네 검색"><select id="district" aria-label="광역 지역 선택"><option>서울시</option><option>인천시</option><option>경기도</option><option>강원도</option><option>부산시</option></select><select id="hood" aria-label="세부 지역 선택"><option value="전체">전체 구</option></select></div>
<div class="layout"><div class="mapbox"><a href="bang.html" class="bang-icon" aria-label="술벙개 페이지로 이동" title="술벙개">🍻</a><div id="map" class="map"></div><button class="locate" id="locate" aria-label="현재 위치">⌖</button></div><aside id="detail" class="detail"></aside></div><div class="foot">© OpenStreetMap contributors · 가격은 방문 전 매장 확인 권장</div></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="stores.js"></script>
<script src="stores-extra.js"></script>
<script>
const IMG='https://alddals-fresh-2.matthewtheresa8379.chatgpt.site';
const imageUrl=p=>(p.startsWith('data:')||p.startsWith('http://')||p.startsWith('https://')||p.startsWith('assets/'))?p:IMG+p;
const map=L.map('map',{minZoom:8,maxZoom:19}).setView([37.6076,126.9179],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map);let selected=11;
const REGION_VIEWS={'서울시':[[37.5665,126.9780],11],'인천시':[[37.4563,126.7052],11],'경기도':[[37.4138,127.5183],9],'강원도':[[37.8228,128.1555],9],'부산시':[[35.1796,129.0756],11]};
const money=n=>Number.isFinite(n)?n.toLocaleString('ko-KR')+'원':'미확인';const priceText=(b,key)=>b[key+'Label']||money(b[key]);const pinTitle=(b,key,fallback)=>b[key+'PinTitle']||fallback;
function hoods(){const d=document.getElementById('district').value;const hs=[...new Set(bars.filter(x=>x.district===d).map(x=>x.hood))].sort((a,b)=>a.localeCompare(b,'ko'));const allLabel=d==='경기도'?'전체 시':d==='강원도'?'전체 시·군':'전체 구';document.getElementById('hood').innerHTML=`<option value="전체">${allLabel}</option>`+hs.map(x=>`<option value="${x}">${x}</option>`).join('')}
function visible(){const d=document.getElementById('district').value,h=document.getElementById('hood').value,q=document.getElementById('q').value.trim();return bars.filter(x=>x.district===d&&(h==='전체'||x.hood===h)&&(`${x.name} ${x.area} ${x.district} ${x.hood}`.includes(q)))}
function icon(b){return L.divIcon({className:'',html:`<div class="pin ${b.id===selected?'sel':''}"><small>${b.name}</small><b><span>${pinTitle(b,'soju','소주')} ${priceText(b,'soju')}</span><span>${pinTitle(b,'beer','맥주')} ${priceText(b,'beer')}</span></b></div>`,iconSize:[150,52],iconAnchor:[75,52]})}
function render(){layer.clearLayers();const vs=visible();vs.forEach(b=>L.marker([b.lat,b.lng],{icon:icon(b)}).addTo(layer).on('click',()=>{selected=b.id;render();detail(b);map.panTo([b.lat,b.lng])}));const s=vs.find(x=>x.id===selected)||vs[0];if(s){selected=s.id;detail(s)}else document.getElementById('detail').innerHTML='<div class="empty">조건에 맞는 술집이 없습니다.</div>'}
function focusVisible(){const vs=visible();if(!vs.length)return;if(vs.length===1){map.flyTo([vs[0].lat,vs[0].lng],15);return}map.fitBounds(vs.map(b=>[b.lat,b.lng]),{padding:[36,36],maxZoom:15})}
function detail(b){const imgs=b.images.map((p,i)=>`<button class="${i===0?'active':''}" data-img="${imageUrl(p)}"><img src="${imageUrl(p)}" alt=""></button>`).join('');document.getElementById('detail').innerHTML=`<div class="gallery"><button class="close" id="close">×</button><img id="mainimg" class="mainimg" src="${imageUrl(b.images[0])}" alt="${b.name}"><div class="thumbs">${imgs}</div></div><div class="pad"><div class="status">● ${b.district} · ${b.hood} · 가격 확인 ${b.checked}</div><h2>${b.name}</h2><p>${b.area}</p><div class="deal"><b>이벤트 알림</b><br>${b.deal}<div class="event-date">이벤트 체크 ${b.eventChecked||b.checked}</div></div><div class="prices"><div class="price"><span>${b.sojuTitle||'소주'}</span><strong>${priceText(b,'soju')}</strong></div><div class="price"><span>${b.beerTitle||'맥주'}</span><strong>${priceText(b,'beer')}</strong></div><div class="price"><span>${b.foodTitle||'최저 안주'}</span><strong>${priceText(b,'food')}</strong></div><div class="price"><span>${b.totalTitle||'예상 최소금액'}</span><strong>${priceText(b,'total')}</strong></div></div><div class="actions"><a class="secondary" target="_blank" href="${b.source}">네이버 장소</a><a class="primary" target="_blank" href="${b.directions}">네이버 길찾기</a></div></div>`;document.querySelectorAll('.thumbs button').forEach(x=>x.onclick=()=>{document.getElementById('mainimg').src=x.dataset.img;document.querySelectorAll('.thumbs button').forEach(y=>y.classList.remove('active'));x.classList.add('active')});const c=document.getElementById('close');if(c)c.onclick=()=>document.getElementById('detail').innerHTML='<div class="empty">지도에서 가격 핀을 눌러 매장 정보를 확인하세요.</div>'}
document.getElementById('district').onchange=()=>{hoods();const d=document.getElementById('district').value;const v=REGION_VIEWS[d]||REGION_VIEWS['서울시'];map.flyTo(v[0],v[1]);render()};document.getElementById('hood').onchange=()=>{render();focusVisible()};document.getElementById('q').oninput=render;document.getElementById('locate').onclick=()=>map.locate({setView:true,maxZoom:16,enableHighAccuracy:true});map.on('locationfound',e=>L.circleMarker(e.latlng,{radius:7,color:'#116842',fillColor:'#fff',fillOpacity:1,weight:3}).addTo(map).bindTooltip('내 위치').openTooltip());document.getElementById('report').onclick=()=>window.open('https://open.kakao.com/o/gpjJdKJi','_blank','noopener');hoods();render();
</script>
</body></html>
