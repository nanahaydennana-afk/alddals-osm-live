<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>알딸쓰 · 술벙개</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#181818}a{text-decoration:none;color:inherit}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}.brand{font-weight:900;font-size:22px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:10px 13px;border-radius:999px;background:#fff;border:1px solid #ddd}.nav a.active{background:#181818;color:#fff}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:10px 0 18px}.hero h1{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:#666}.create{border:0;border-radius:14px;background:#181818;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 12px;cursor:pointer}.filters button.on{background:#ffefe6;border-color:#ffb68a;color:#9a3900;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e2e2df;border-radius:18px;padding:16px}.status{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:12px;background:#fff2eb;color:#a64100;font-weight:800}.card h3{margin:12px 0 6px;font-size:19px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;color:#555;font-size:14px}.msg{background:#f6f6f3;border-radius:12px;padding:10px 12px;font-size:14px}.join{display:block;text-align:center;margin-top:12px;padding:11px 12px;border-radius:12px;background:#fee500;color:#191919;font-weight:900}.join.disabled{background:#eee;color:#999;pointer-events:none}.safety{margin-top:18px;padding:14px;border-radius:14px;background:#fff;border:1px solid #e2e2df;color:#666;font-size:13px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:999}.modal.open{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#eee;border-radius:50%;width:36px;height:36px;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.form label{font-size:13px;color:#555}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid #ddd;border-radius:10px;padding:10px;font:inherit}.form .full{grid-column:1/-1}.submit{grid-column:1/-1;border:0;background:#181818;color:#fff;padding:12px;border-radius:12px;font-weight:900}.notice{margin-top:10px;font-size:13px;color:#666}.foot{margin:28px 0 10px;color:#777;font-size:13px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.form{grid-template-columns:1fr}.form .full,.submit{grid-column:1}.wrap{padding:14px}.hero h1{font-size:26px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">🍻 알딸쓰</div><nav class="nav"><a href="index.html">지도</a><a class="active" href="/bang.html">술벙개</a><a href="https://open.kakao.com/o/gpjJdKJi" target="_blank" rel="noopener">공식 오픈채팅</a></nav></header><section class="hero"><div><h1>술벙개</h1><p>오늘, 가까운 동네에서 가볍게 한잔할 사람을 찾아요.</p></div><button class="create" id="openCreate">+ 술벙개 만들기</button></section><div class="filters" id="filters"><button class="on" data-area="전체">전체</button><button data-area="연신내">연신내</button><button data-area="응암동">응암동</button><button data-area="역촌동">역촌동</button><button data-area="홍제동">홍제동</button></div><main class="grid" id="list"></main><div class="safety">⚠️ 술벙개는 공개된 장소에서 만나고, 금전 요구·과도한 개인정보 공유는 피해주세요. 귀가 계획도 미리 챙기기.</div><div class="foot">© 2026 알딸쓰 · 술벙개 BETA</div></div><div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><div><b>새 술벙개</b><div style="color:#777;font-size:13px">오늘 한잔할 사람 모으기</div></div><button class="x" id="close">×</button></div><form class="form" id="form"><label class="full">제목<input name="title" required placeholder="예: 연신내 소주 2천원집 같이 가요"></label><label>지역<select name="area"><option>연신내</option><option>응암동</option><option>역촌동</option><option>홍제동</option></select></label><label>장소<input name="place" required placeholder="매장명"></label><label>시간<input name="time" required placeholder="오늘 19:30"></label><label>최대 인원<input name="max" type="number" min="2" max="10" value="4"></label><label>닉네임<input name="host" required placeholder="방장 닉네임"></label><label>예상 술값<input name="cost" placeholder="1인 약 15,000원"></label><label class="full">한마디<textarea name="message" rows="3" placeholder="편하게 한잔해요"></textarea></label><label class="full">카카오 오픈채팅 링크<input name="chat" placeholder="비워 두면 공식 오픈채팅방으로 연결됩니다"></label><button class="submit" type="submit">술벙개 등록하기</button></form><div class="notice" id="notice"></div></div></div><script>
const DEFAULT_CHAT='https://open.kakao.com/o/gpjJdKJi';
const seed=[
{id:1,area:'연신내',title:'연신내 소주 2천원집 같이 가요',place:'마장동고기집 연신내역점',time:'오늘 19:30',now:2,max:4,host:'퇴근한잔',cost:'1인 약 18,000원',message:'퇴근하고 고기 조금에 소주 가볍게. 30~40대 환영!',chat:DEFAULT_CHAT},
{id:2,area:'응암동',title:'응암 불광천에서 2차까지',place:'불광천 서서갈비',time:'오늘 20:00',now:1,max:3,host:'응암러',cost:'1인 약 15,000원',message:'동네분이면 더 좋아요. 과음 없이 딱 한두잔.',chat:DEFAULT_CHAT},
{id:3,area:'역촌동',title:'역촌 가성비 술집 번개',place:'더블쪼끼',time:'내일 18:30',now:3,max:4,host:'술값아끼자',cost:'1인 약 14,000원',message:'치킨 반마리 + 생맥주. 한 자리 남았어요.',chat:DEFAULT_CHAT}];
let rooms=[...seed];let area='전체';const list=document.getElementById('list');
function render(){list.innerHTML='';rooms.filter(r=>area==='전체'||r.area===area).forEach(r=>{const full=r.now>=r.max;const el=document.createElement('article');el.className='card';el.innerHTML=`<span class="status">${full?'모집완료':'🔥 모집중'}</span><h3>${r.title}</h3><div style="color:#777;font-size:14px">📍 ${r.area} · ${r.place}</div><div class="meta"><span>🕒 ${r.time}</span><span>👥 ${r.now}/${r.max}명</span><span>👤 ${r.host}</span><span>💸 ${r.cost||'예상 비용 미정'}</span></div><div class="msg">${r.message||'편하게 한잔해요.'}</div><a class="join ${full?'disabled':''}" href="${r.chat||DEFAULT_CHAT}" target="_blank" rel="noopener">${full?'모집 완료':'카카오 오픈채팅 참여'}</a>`;list.appendChild(el)})}
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;area=b.dataset.area;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));render()});
const modal=document.getElementById('modal');document.getElementById('openCreate').onclick=()=>modal.classList.add('open');document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);rooms.unshift({id:Date.now(),area:f.get('area'),title:f.get('title'),place:f.get('place'),time:f.get('time'),now:1,max:Number(f.get('max')),host:f.get('host'),cost:f.get('cost'),message:f.get('message'),chat:f.get('chat')||DEFAULT_CHAT});area='전체';document.querySelectorAll('#filters button').forEach((x,i)=>x.classList.toggle('on',i===0));render();document.getElementById('notice').textContent='술벙개가 등록됐어요.';e.currentTarget.reset();setTimeout(()=>modal.classList.remove('open'),500)});render();
</script></body></html>
